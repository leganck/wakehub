# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: wakehub-server
    main: ./cmd/server
    binary: wakehub-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.buildTime={{.Date}}

  - id: wakehub-client
    main: ./cmd/client
    binary: wakehub-client
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.buildTime={{.Date}}

archives:
  - id: wakehub-server
    ids:
      - wakehub-server
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md
      - .env.example

  - id: wakehub-client
    ids:
      - wakehub-client
    formats: [tar.gz]
    name_template: >-
      {{ .Binary }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md

dockers:
  - id: wakehub-server-amd64
    ids:
      - wakehub-server
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/leganck/wakehub:latest-amd64"
      - "ghcr.io/leganck/wakehub:{{ .Tag }}-amd64"
      - "ghcr.io/leganck/wakehub:v{{ .Major }}.{{ .Minor }}-amd64"
    use: buildx
    dockerfile: Dockerfile.release
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=WakeHub"
      - "--label=org.opencontainers.image.description=WakeHub server with Bemfa MQTT"
      - "--label=org.opencontainers.image.source=https://github.com/leganck/wakehub"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

  - id: wakehub-server-arm64
    ids:
      - wakehub-server
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/leganck/wakehub:latest-arm64"
      - "ghcr.io/leganck/wakehub:{{ .Tag }}-arm64"
      - "ghcr.io/leganck/wakehub:v{{ .Major }}.{{ .Minor }}-arm64"
    use: buildx
    dockerfile: Dockerfile.release
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=WakeHub"
      - "--label=org.opencontainers.image.description=WakeHub server with Bemfa MQTT"
      - "--label=org.opencontainers.image.source=https://github.com/leganck/wakehub"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

docker_manifests:
  - name_template: "ghcr.io/leganck/wakehub:latest"
    image_templates:
      - "ghcr.io/leganck/wakehub:latest-amd64"
      - "ghcr.io/leganck/wakehub:latest-arm64"

  - name_template: "ghcr.io/leganck/wakehub:{{ .Tag }}"
    image_templates:
      - "ghcr.io/leganck/wakehub:{{ .Tag }}-amd64"
      - "ghcr.io/leganck/wakehub:{{ .Tag }}-arm64"

  - name_template: "ghcr.io/leganck/wakehub:v{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/leganck/wakehub:v{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/leganck/wakehub:v{{ .Major }}.{{ .Minor }}-arm64"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
