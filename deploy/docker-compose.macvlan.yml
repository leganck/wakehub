# WakeHub 服务端 — macvlan 示例（Linux 生产，二层直达局域网发 Magic Packet）
#
# 在同时包含本项目目录(wol/wakehub) 与 bemfa-go 的父目录执行，或：
#   cd <project-dir> && docker compose -f deploy/docker-compose.macvlan.yml up -d --build
#
# 环境变量（可复制 .env.example 为 .env）：
#   WAKEHUB_PARENT_IFACE  宿主机网卡，如 eth0 / enp3s0
#   WAKEHUB_SUBNET        局域网网段
#   WAKEHUB_GATEWAY       网关
#   WAKEHUB_IP            容器固定 IP（勿与现有主机冲突）

services:
  wakehub-server:
    build:
      context: ../..
      dockerfile: wol/deploy/Dockerfile.context
    image: wakehub-server:local
    container_name: wakehub-server
    restart: unless-stopped
    volumes:
      - ../data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    networks:
      wakehub_macvlan:
        ipv4_address: ${WAKEHUB_IP:-192.168.1.50}

networks:
  wakehub_macvlan:
    driver: macvlan
    driver_opts:
      parent: ${WAKEHUB_PARENT_IFACE:-eth0}
    ipam:
      config:
        - subnet: ${WAKEHUB_SUBNET:-192.168.1.0/24}
          gateway: ${WAKEHUB_GATEWAY:-192.168.1.1}
