# WakeHub 服务端 — 桥接网络示例（开发 / 简易部署）
#
# 启动：
#   docker compose up -d --build
# 访问：
#   http://127.0.0.1:8080
#
# 说明：
# - 配置持久化在 ./data/config.json
# - 默认从 Dockerfile 拉取已发布的 github.com/leganck/bemfa-go
# - 桥接模式下 Magic Packet 广播可能无法直达局域网二层；
#   生产唤醒建议用 deploy/docker-compose.macvlan.yml（Linux）
#   或 network_mode: host（仅 Linux）

services:
  wakehub-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: wakehub-server:local
    container_name: wakehub-server
    restart: unless-stopped
    ports:
      - "${WAKEHUB_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    # Linux 同网段唤醒可选：取消注释下一行并注释掉 ports
    # network_mode: host
